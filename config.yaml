# Constitution RAG configuration (single source of truth for ablations)
seed: 42

# Paths
paths:
  raw_dir: data/raw
  processed_dir: data/processed
  eval_dir: data/eval
  index_dir: data/indexes
  results_dir: results
  report_dir: report

# Chunking variants to index
chunking:
  variants:
    - article          # one Article per chunk
    - fixed256         # fixed 256-token chunks
    - fixed512         # fixed 512-token chunks
  default: article

# Embedding models (one FAISS index per model per chunking variant)
embedding:
  models:
    - name: sentence-transformers/all-MiniLM-L6-v2
      dim: 384
      normalize: true
    - name: BAAI/bge-small-en-v1.5
      dim: 384
      normalize: true
    - name: intfloat/multilingual-e5-small
      dim: 384
      normalize: true
  default: sentence-transformers/all-MiniLM-L6-v2

# Retrieval
retrieval:
  default_retriever: hybrid   # bm25 | dense | hybrid
  default_top_k: 10
  rrf_k: 60                   # Reciprocal Rank Fusion constant

# Reranker
reranker:
  model: cross-encoder/ms-marco-MiniLM-L-12-v2
  rerank_top_n: 20            # rescore top 20
  final_top_n: 5              # return top 5 after rerank
  enabled: false

# Abstention
abstain:
  enabled: true
  # If best (reranked/dense) score below this threshold -> abstain
  score_threshold: 0.25
  threshold_source: config    # config | sweep

# Generation
generation:
  # llm_mode: api | local | none  (none = no-retrieval ablation)
  llm_mode: none
  api_base: https://api.example.com/v1
  api_model: gpt-4o-mini
  api_key_env: RAG_API_KEY
  local_model: Qwen/Qwen2.5-1.5B-Instruct
  local_device: cpu
  max_new_tokens: 256
  temperature: 0.2

# Evaluation
evaluation:
  qa_set: data/eval/qa_set.jsonl
  ks: [1, 3, 5, 10]
  ablations:
    - chunking
    - retriever
    - reranker
    - top_k
    - embedding_model
    - rag_vs_noretrieval
    - abstain_threshold
